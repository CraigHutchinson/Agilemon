; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = waveshareEpaper
; custom common options

[env]
platform = espressif32 @ ^6.8.1
board = esp32dev
framework = arduino
build_flags =
    ;-std=c++23
    -Wall
    -Werror
lib_deps =
    ;https://github.com/catchorg/Catch2
    ;https://github.com/espressif/esp-idf-cxx
    SPI
    Wire
    Adafruit GFX Library@1.11
    WiFiClientSecure@2.0.0
    https://github.com/CraigHutchinson/rapidjson#patch-1

monitor_speed = 115200
upload_speed = 2000000

;build_flags =
;    -D VERSION=1.2.3
;    -D DEBUG=1

[env:waveshareEpaper]
board = esp32dev
build_flags =
    -D WAVESHARE_EPAPER
    ${env.build_flags}


[env:lilygoT5]
;https://github.com/Xinyuan-LilyGO/LilyGo-T5-Epaper-Series
; and https://github.com/Xinyuan-LilyGO/LilyGo-T5-Grayscale
board = esp32dev
build_flags =
    -D LILYGO_T5_V213
    ${env.build_flags}

[env:lilygoTWrist]
;https://github.com/Xinyuan-LilyGO/Wrist-E-Paper
board = esp32dev
build_flags =
    -D LILYGO_TWRIST_V1_1
    ${env.build_flags}